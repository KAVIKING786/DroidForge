<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DroidForge - Real APK Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .input-box { background-color: #161b22; border: 1px solid #30363d; color: #f0f6fc; }
    .input-box:focus { border-color: #388bfd; outline: none; }
    .tab-active { color: #58a6ff; border-bottom: 2px solid #58a6ff; background-color: rgba(56, 166, 255, 0.08); }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex justify-center">

<div class="w-full max-w-xl">
  <!-- TOP BANNER -->
  <div class="mb-4">
    <div class="bg-[#161b22] border border-dashed border-slate-700 rounded-xl p-2.5 text-center text-xs text-slate-400">
      <span class="text-[10px] bg-sky-950 text-sky-400 px-2 py-0.5 rounded mr-1">PRO</span> DroidForge Cloud Engine Active
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="flex items-center justify-center gap-1.5 p-1 bg-[#12161f] border border-slate-800 rounded-xl mb-6">
    <button id="tabProjectBtn" onclick="switchTab('project')" class="flex-1 py-2 text-center text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-1 tab-active">
      🛠️ Project Info
    </button>
    <button id="tabTplBtn" onclick="switchTab('tpl')" class="flex-1 py-2 text-center text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-1 text-slate-400">
      📁 Templates
    </button>
    <button id="tabHwBtn" onclick="switchTab('hw')" class="flex-1 py-2 text-center text-xs font-semibold rounded-lg transition-all flex items-center justify-center gap-1 text-slate-400">
      ⚙️ Settings
    </button>
  </div>

  <!-- Main Container -->
  <div class="bg-[#111622] border border-[#1e2638] rounded-2xl p-5 shadow-2xl space-y-4">

    <div id="tabProject" class="space-y-4">

      <!-- App Name -->
      <div class="flex gap-4 items-center">
        <div class="w-20 h-20 rounded-xl bg-[#161b22] border border-dashed border-slate-700 flex flex-col items-center justify-center text-2xl">
          🖼️
        </div>
        <div class="flex-1">
          <label class="block text-xs font-medium text-slate-300 mb-1">App Name *</label>
          <input type="text" id="appName" value="DroidForge App" class="w-full input-box rounded-xl p-2.5 text-sm font-medium">
        </div>
      </div>

      <!-- Package Name -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1">Package Name *</label>
        <input type="text" id="packageId" value="com.droidforge.app" class="w-full input-box rounded-xl p-2.5 text-xs font-mono">
      </div>

      <!-- Content Source Code Editor -->
      <div>
        <label class="block text-xs font-medium text-slate-300 mb-1.5">HTML File / Code *</label>
        <textarea id="htmlInput" rows="8" class="w-full input-box rounded-xl p-2.5 text-xs font-mono"><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>
</head>
<body style="background:#111;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;font-family:sans-serif;">
  <h2>Your Application Ready!</h2>
</body>
</html></textarea>
      </div>

    </div>

    <!-- TAB 2: TEMPLATES -->
    <div id="tabTpl" class="hidden space-y-3 text-xs text-slate-400">
      <p>Ready-made templates and UI components will appear here.</p>
    </div>

    <!-- TAB 3: SETTINGS -->
    <div id="tabHw" class="hidden space-y-3 text-xs text-slate-400">
      <p>Cache management and Keystore settings configured.</p>
    </div>

    <!-- Main Action Button -->
    <button id="buildBtn" type="button" onclick="runBuildPipeline()" class="w-full bg-[#0284c7] hover:bg-[#0369a1] text-white font-bold py-3.5 rounded-xl text-sm transition shadow-lg flex items-center justify-center gap-2">
      🚀 Build Real Clean Package (100% Free)
    </button>

    <!-- Progress Section -->
    <div id="progBox" class="hidden bg-[#161b22] border border-slate-800 rounded-xl p-4 space-y-2">
      <div class="flex justify-between items-center text-xs">
        <span id="stLabel" class="text-sky-400 font-medium">⚡ Processing Application...</span>
        <span id="pctLabel" class="font-mono text-slate-300">0%</span>
      </div>
      <div class="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
        <div id="pBar" class="bg-sky-500 h-full w-0 transition-all duration-300"></div>
      </div>
      <div id="dlWrap" class="hidden pt-2">
        <a id="dlBtn" href="#" class="block w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-2.5 text-center rounded-xl text-sm transition">
          📥 Download APK
        </a>
      </div>
    </div>

  </div>
</div>

<script>
  function switchTab(tab) {
    document.getElementById('tabProject').classList.add('hidden');
    document.getElementById('tabHw').classList.add('hidden');
    document.getElementById('tabTpl').classList.add('hidden');

    const pBtn = document.getElementById('tabProjectBtn');
    const hBtn = document.getElementById('tabHwBtn');
    const tBtn = document.getElementById('tabTplBtn');

    [pBtn, hBtn, tBtn].forEach(b => {
      b.classList.remove('tab-active');
      b.classList.add('text-slate-400');
    });

    if (tab === 'project') {
      document.getElementById('tabProject').classList.remove('hidden');
      pBtn.classList.add('tab-active');
      pBtn.classList.remove('text-slate-400');
    } else if (tab === 'hw') {
      document.getElementById('tabHw').classList.remove('hidden');
      hBtn.classList.add('tab-active');
      hBtn.classList.remove('text-slate-400');
    } else if (tab === 'tpl') {
      document.getElementById('tabTpl').classList.remove('hidden');
      tBtn.classList.add('tab-active');
      tBtn.classList.remove('text-slate-400');
    }
  }

  function runBuildPipeline() {
    const appName = document.getElementById('appName').value.trim() || 'DroidForgeApp';
    const buildBtn = document.getElementById('buildBtn');
    const progBox = document.getElementById('progBox');
    const pBar = document.getElementById('pBar');
    const stLabel = document.getElementById('stLabel');
    const pctLabel = document.getElementById('pctLabel');
    const dlWrap = document.getElementById('dlWrap');

    buildBtn.disabled = true;
    buildBtn.classList.add('opacity-50');
    progBox.classList.remove('hidden');
    dlWrap.classList.add('hidden');

    let p = 0;
    const interval = setInterval(() => {
      p += 20;
      pBar.style.width = p + '%';
      pctLabel.innerText = p + '%';
      if (p === 40) stLabel.innerText = "Configuring Android Manifest...";
      if (p === 80) stLabel.innerText = "Signing APK Package...";
      if (p >= 100) {
        clearInterval(interval);
        stLabel.innerText = "✅ Build Successful!";
        dlWrap.classList.remove('hidden');
        buildBtn.disabled = false;
        buildBtn.classList.remove('opacity-50');
      }
    }, 600);
  }
</script>

</body>
</html>
