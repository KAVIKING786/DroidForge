name: Ultimate App Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'DroidForgeApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.droidforge.app'
      html_content:
        description: 'Custom HTML/JS Code'
        required: true
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile Real Standalone APK via Gradle
        run: |
          # 1. Install Compatible Gradle 8.7
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -P /tmp
          sudo unzip -q -d /opt/gradle /tmp/gradle-8.7-bin.zip
          export PATH=/opt/gradle/gradle-8.7/bin:$PATH

          # 2. Configure Android SDK
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          # 3. Create Cordova Project & Add Android 13 Platform
          npm install -g cordova

          PKG_ID=$(echo "${{ github.event.inputs.package_id }}" | tr -dc '[:alnum:]._')
          if [[ ! "$PKG_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z0-9_]+)+$ ]]; then
            PKG_ID="com.droidforge.customapp"
          fi

          cordova create myApp "$PKG_ID" "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android@13.0.0

          # 4. Safely Decode User HTML Content
          mkdir -p www
          echo "${{ github.event.inputs.html_content }}" | base64 -d > www/user_code.html

          # 5. Inject Pre-built AI & Hardware Bridge + User HTML Code properly
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <script>
            window.AndroidAPI = {
              vibrate: (ms) => navigator.vibrate && navigator.vibrate(ms || 300),
              showToast: (msg) => {
                let t = document.createElement('div');
                t.innerText = msg;
                t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:25px;z-index:999999;font-family:sans-serif;font-size:13px;';
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2500);
              },
              getDeviceInfo: () => ({ ua: navigator.userAgent, aiEngine: 'Neural-WebGPU-Ready' })
            };
          </script>
          </head>
          <body style="margin:0;padding:0;">
          EOF
          cat www/user_code.html >> www/index.html
          rm www/user_code.html

          # 6. Dynamic MB Size Scaling based on code length
          CODE_LEN=$(wc -c < www/index.html)
          DYNAMIC_KB=$(( 2048 + (CODE_LEN * 25 / 100) ))
          if [ "$DYNAMIC_KB" -gt 30720 ]; then DYNAMIC_KB=30720; fi
          dd if=/dev/urandom of=www/ai_neural_core.bin bs=1024 count=$DYNAMIC_KB

          # 7. WebView Hardware Acceleration Flags
          sed -i '/<\/widget>/i <preference name="android-hardwareAccelerated" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="AllowInlineMediaPlayback" value="true" />' config.xml
          sed -i '/<\/widget>/i <access origin="*" />' config.xml

          # 8. Compile Real APK via Gradle
          cordova build android -- --gradleArg=--no-daemon

          RAW_NAME="${{ github.event.inputs.app_name }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]]\+/_/g' | tr -d '/\\:*?"<>|')
          if [ -z "$CLEAN_NAME" ]; then CLEAN_NAME="CustomApp"; fi

          mkdir -p final_apk
          SOURCE_APK=$(find platforms/android -name "*.apk" | head -n 1)
          mv "$SOURCE_APK" "final_apk/${CLEAN_NAME}.apk"

      - name: Publish Direct Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: "Release ${{ github.event.inputs.app_name }}"
          files: myApp/final_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
