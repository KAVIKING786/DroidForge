name: DroidForge APK Builder

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        default: "DroidForge App"
      package_id:
        description: "Package ID"
        required: true
        default: "com.droidforge.app"
      build_id:
        description: "Unique build id"
        required: true
        default: "build12345"
      version_name:
        description: "Version name"
        required: false
        default: "1.0"
      version_code:
        description: "Version code"
        required: false
        default: "1"
      html_content:
        description: "Base64 encoded HTML"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_ID: ${{ inputs.package_id }}
      BUILD_ID: ${{ inputs.build_id }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      HTML_B64: ${{ inputs.html_content }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Manual Setup Android SDK & Build Tools
        run: |
          echo "Setting up Android SDK manually..."
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          rm -rf $ANDROID_SDK_ROOT/cmdline-tools/latest
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          # Add to PATH properly for this step and subsequent steps
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          # Accept licenses and install platform 34
          yes | sdkmanager --licenses || true
          sdkmanager --update || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create project and inject HTML
        run: |
          SAFE_NAME=$(printf '%s' "$APP_NAME" | tr -dc '[:alnum:]_-')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="DroidForge"; fi
          echo "SAFE_NAME=$SAFE_NAME" >> "$GITHUB_ENV"

          cordova create app "$PACKAGE_ID" "$APP_NAME"
          rm -rf app/www/*

          if [ -n "$HTML_B64" ]; then
            printf '%s' "$HTML_B64" | base64 -d > app/www/index.html
          else
            echo "<!DOCTYPE html><html><body><h2>App</h2></body></html>" > app/www/index.html
          fi

          cd app
          sed -i "s/<widget /<widget android-versionCode=\"$VERSION_CODE\" /" config.xml
          sed -i "s/\(<widget [^>]*\)version=\"[^\"]*\"/\1version=\"$VERSION_NAME\"/" config.xml

      - name: Build debug APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          cd app
          cordova platform add android@13
          cordova build android --debug

          APK_FILE=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "APK was not created"; exit 1
          fi

          mkdir -p ../out
          cp "$APK_FILE" "../out/${SAFE_NAME}-${BUILD_ID}.apk"

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ inputs.build_id }}
          name: "DroidForge build ${{ inputs.build_id }}"
          files: out/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
