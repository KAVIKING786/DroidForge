name: Ultimate App Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App Name"
        required: true
        default: "UniversalApp"
      package_id:
        description: "Package ID"
        required: true
        default: "com.universal.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova
        run: npm install -g cordova

      - name: Validate package ID
        run: |
          PACKAGE_ID="${{ github.event.inputs.package_id }}"
          if [[ ! "$PACKAGE_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Invalid package ID: $PACKAGE_ID"
            echo "Example: com.myname.myapp"
            exit 1
          fi

      - name: Create Cordova Android project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          PACKAGE_ID="${{ github.event.inputs.package_id }}"

          SAFE_NAME=$(printf '%s' "$APP_NAME" | tr -dc '[:alnum:]_-')
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="UniversalApp"
          fi

          cordova create "$SAFE_NAME" "$PACKAGE_ID" "$APP_NAME"
          cd "$SAFE_NAME"

          rm -rf www
          mkdir -p www

          if [ -d "../app-www" ]; then
            cp -r ../app-www/* www/
          else
            echo "<h1>app-www folder not found</h1>" > www/index.html
          fi

          cordova platform add android
          cordova plugin add cordova-plugin-whitelist

      - name: Build debug APK
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(printf '%s' "$APP_NAME" | tr -dc '[:alnum:]_-')
          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="UniversalApp"
          fi

          cd "$SAFE_NAME"
          cordova build android --debug

          APK_FILE=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK was not created"
            exit 1
          fi

          cp "$APK_FILE" "${SAFE_NAME}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            */*.apk
            */platforms/android/app/build/outputs/apk/debug/*.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: "Release - ${{ github.event.inputs.app_name }}"
          files: |
            */*.apk
            */platforms/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
