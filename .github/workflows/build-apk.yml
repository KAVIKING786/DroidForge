name: Ultimate App Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'UniversalApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.universal.app'
      html_content:
        description: 'Custom HTML/JS Code'
        required: true
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: beevelop/cordova:latest

    steps:
      - name: Create Complete Android Project
        run: |
          cordova create myApp ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android
          # Decode HTML content safely first
          mkdir -p www
          echo "${{ github.event.inputs.html_content }}" | base64 -d > www/index.html

          # Basic core plugin
          cordova plugin add cordova-plugin-whitelist

          # Smart Auto-Detect Plugins based on code
          if grep -qi "camera\|capturePhoto" www/index.html; then
            echo "Camera detected, adding camera plugin..."
            cordova plugin add cordova-plugin-camera
          fi

          if grep -qi "audio\|record\|media" www/index.html; then
            echo "Media/Audio detected, adding media plugin..."
            cordova plugin add cordova-plugin-media
          fi

          if grep -qi "vibrate\|vibration" www/index.html; then
            echo "Vibration detected, adding vibration plugin..."
            cordova plugin add cordova-plugin-vibration
          fi

          if grep -qi "permission" www/index.html; then
            cordova plugin add cordova-plugin-android-permissions
          fi

          # Inject Hardware Acceleration & Permissions in Config
          sed -i '/<\/widget>/i <preference name="android-hardwareAccelerated" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="AllowInlineMediaPlayback" value="true" />' config.xml

          find platforms/android -name "*.gradle" -type f -exec sed -i 's|jcenter()|google()\n  mavenCentral()|g' {} +

      - name: Build Standalone APK
        run: |
          cd myApp
          # Modern WebView Flags for AI, WebGL, 3D/Canvas, Audio/Video & Camera
          sed -i '/<\/widget>/i <preference name="android-hardwareAccelerated" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="AllowInlineMediaPlayback" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="MixedContentMode" value="0" />' config.xml

          # Fast Build Execution
          cordova build android --debug -- --gradleArg=--no-daemon

          # Real Safe Dynamic App Name Extraction
          RAW_NAME="${{ github.event.inputs.app_name }}"
          SAFE_NAME=$(echo "$RAW_NAME" | tr -dc '[:alnum:]_')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="DroidApp"; fi

          # Dynamically scaled APK naming
          mv platforms/android/app/build/outputs/apk/debug/app-debug.apk "platforms/android/app/build/outputs/apk/debug/${SAFE_NAME}.apk"

      - name: Publish Direct Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.run_id }}
          name: "Release ${{ github.event.inputs.app_name }}"
          files: myApp/platforms/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
