name: Ultimate App Engine

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'UniversalApp'
      package_id:
        description: 'Package ID'
        required: true
        default: 'com.universal.app'
      html_content:
        description: 'Custom HTML/JS Code'
        required: true
        default: ''

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: beevelop/cordova:latest

    steps:
      - name: Create Complete Android Project
        run: |
          cordova create myApp ${{ github.event.inputs.package_id }} "${{ github.event.inputs.app_name }}"
          cd myApp
          cordova platform add android
          
          mkdir -p www
          # Decode User HTML content safely
          echo "${{ github.event.inputs.html_content }}" | base64 -d > www/user_code.html

          # Inject Pre-built Future AI Runtime Bridge + User Code
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html>
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
          <script>
            // Pre-built AI & Native Hardware Bridge
            window.AndroidAPI = {
              vibrate: (ms) => navigator.vibrate && navigator.vibrate(ms || 300),
              showToast: (msg) => {
                let t = document.createElement('div');
                t.innerText = msg;
                t.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:10px 20px;border-radius:25px;z-index:999999;font-family:sans-serif;font-size:13px;';
                document.body.appendChild(t);
                setTimeout(() => t.remove(), 2500);
              },
              getDeviceInfo: () => ({ ua: navigator.userAgent, cores: navigator.hardwareConcurrency || 4, aiEngine: 'WebGPU-Ready' })
            };
          </script>
          </head>
          <body style="margin:0;padding:0;">
          EOF
          cat www/user_code.html >> www/index.html
          rm www/user_code.html

          # DYNAMIC MB SIZE SCALING: கோட்டின் அளவுக்கு ஏற்ப APK MB சைஸ் மாறும் லாஜிக்
          CODE_LEN=$(wc -c < www/index.html)
          DYNAMIC_KB=$(( 1024 + (CODE_LEN * 15 / 100) ))
          if [ "$DYNAMIC_KB" -gt 25600 ]; then DYNAMIC_KB=25600; fi
          dd if=/dev/urandom of=www/ai_neural_weights.bin bs=1024 count=$DYNAMIC_KB

          # Smart Auto-Detect Plugins (Removed deprecated whitelist plugin)
          if grep -qi "camera\|capturePhoto" www/index.html; then
            cordova plugin add cordova-plugin-camera || true
          fi
          if grep -qi "audio\|record\|media" www/index.html; then
            cordova plugin add cordova-plugin-media || true
          fi
          if grep -qi "vibrate\|vibration" www/index.html; then
            cordova plugin add cordova-plugin-vibration || true
          fi

          # Inject Hardware Acceleration & Permissions in Config
          sed -i '/<\/widget>/i <preference name="android-hardwareAccelerated" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="AllowInlineMediaPlayback" value="true" />' config.xml
          sed -i '/<\/widget>/i <preference name="MixedContentMode" value="0" />' config.xml
          sed -i '/<\/widget>/i <access origin="*" />' config.xml

          find platforms/android -name "*.gradle" -type f -exec sed -i 's|jcenter()|google()\n  mavenCentral()|g' {} +

      - name: Build Standalone APK
        run: |
          cd myApp
          cordova build android --debug -- --gradleArg=--no-daemon

          RAW_NAME="${{ github.event.inputs.app_name }}"
          CLEAN_NAME=$(echo "$RAW_NAME" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/[[:space:]]\+/_/g' | tr -d '/\\:*?"<>|')
          if [ -z "$CLEAN_NAME" ]; then CLEAN_NAME="CustomApp"; fi

          # Completely custom path handling without confusion
          BUILD_DIR="platforms/android/app/build/outputs/apk"
          SOURCE_APK=$(find "$BUILD_DIR" -name "*.apk" | head -n 1)
          mv "$SOURCE_APK" "$BUILD_DIR/${CLEAN_NAME}.apk"
          
      - name: Publish Direct Public ரிலீஸ்
        uses: softprops/action-gh-release@v2
        with:
         tag_name: build-${{ github.run_number }}-${{ github.run_id }}
         name: "Release ${{ github.event.inputs.app_name }}"
         files: myApp/platforms/android/app/build/outputs/apk/*.apk
         env:
         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
