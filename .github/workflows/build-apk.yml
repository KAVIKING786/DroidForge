name: Build Real Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Name'
        required: true
        default: 'DroidForgeApp'
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.droidforge.app'
      web_url:
        description: 'Website URL'
        required: true
        default: 'https://google.com'
      icon_url:
        description: 'Icon Image URL'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Clone Real Webview Engine
        run: |
          git clone https://github.com/mikespub-archive/android-webview.git android-engine
          cd android-engine
          sed -i 's|applicationId ".*"|applicationId "${{ github.event.inputs.package_name }}"|g' app/build.gradle
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">${{ github.event.inputs.app_name }}</string>|g' app/src/main/res/values/strings.xml
          sed -i 's|loadUrl(".*")|loadUrl("${{ github.event.inputs.web_url }}")|g' app/src/main/java/*/MainActivity.java || true

      - name: Build Full APK (~25MB)
        run: |
          cd android-engine
          chmod +x gradlew
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-Real-APK
          path: android-engine/app/build/outputs/apk/**/*.apk
